{% extends 'base.html' %}

{% block title %}Geçersiz İstek (400) — kararsızım{% endblock %}

{% block content %}
<div class="card" style="max-width: 620px; margin: 2rem auto; text-align: center;">
  <span style="font-size: 3rem; display: block; margin-bottom: 0.5rem;" aria-hidden="true">🤷‍♂️⚖️</span>
  <h1 style="font-size: 1.75rem; color: var(--blue-900); margin-bottom: 0.5rem;">
    İstek Oylamasında Çelişki Var!
  </h1>
  <p style="color: var(--muted); font-size: 1rem; margin-bottom: 1.75rem;">
    Gönderilen istek anlaşılamadı veya eksik bilgiler içeriyor.
  </p>

  <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
    <a href="{% url 'home' %}" class="btn btn-primary">
      &larr; Anasayfaya Dön
    </a>
  </div>
</div>
{% endblock %}
